name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor is Node 20, which is where the built-in test runner and
        # stable ESM support land. Nothing here needs a newer runtime: the
        # sources are plain JavaScript, so there is no build step.
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install dev dependencies
        run: npm install --no-audit --no-fund

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

  installable:
    name: the published bin actually runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Regression guard. An earlier revision pointed `bin` at a .ts file, which
      # works when run from a checkout and fails the moment the package lands in
      # node_modules, because Node refuses to type-strip there. Installing the
      # packed tarball is the only test that reproduces that.
      - name: Install the tarball into a real node_modules
        run: |
          npm pack --pack-destination "$RUNNER_TEMP" >/dev/null
          mkdir -p "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          npm init -y >/dev/null
          npm install "$RUNNER_TEMP"/dsh-deadend-*.tgz --no-audit --no-fund >/dev/null

      - name: The bin resolves inside node_modules and runs
        run: |
          cd "$RUNNER_TEMP/consumer"
          resolved="$(realpath node_modules/dsh-deadend/src/cli.js)"
          case "$resolved" in
            */node_modules/dsh-deadend/*) echo "resolved: $resolved" ;;
            *) echo "expected a real copy inside node_modules, got $resolved"; exit 1 ;;
          esac
          ./node_modules/.bin/deadend --version

  demo:
    name: demo (dogfoods the gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run the end-to-end demo
        run: ./examples/demo.sh

      - name: The exit codes are the contract
        run: |
          # The runner's shell is `bash -e`, and every interesting command here
          # exits non-zero by design, so errexit has to go.
          set +e
          work="$(mktemp -d)"
          cd "$work"
          printf '{"name":"gate"}\n' > package.json
          de() { node "$GITHUB_WORKSPACE/src/cli.js" "$@"; }

          de record --title "make build fails" --cmd "make build" \
            --symptom "error: missing separator" --anchor package.json >/dev/null
          recorded=$?

          de check --cmd "make build" -q; blocked=$?

          printf '{"name":"gate","changed":true}\n' > package.json
          de check --cmd "make build" -q; suspect=$?

          de verify dd_ --now-works >/dev/null
          de check --cmd "make build" -q; clear=$?

          printf 'recorded=%s blocked=%s suspect=%s clear=%s\n' \
            "$recorded" "$blocked" "$suspect" "$clear"

          [ "$recorded" -eq 0 ] || { echo "record should succeed, got $recorded"; exit 1; }
          [ "$blocked" -eq 3 ] || { echo "expected 3 (blocked), got $blocked"; exit 1; }
          [ "$suspect" -eq 4 ] || { echo "expected 4 (suspect), got $suspect"; exit 1; }
          [ "$clear" -eq 0 ] || { echo "expected 0 (clear), got $clear"; exit 1; }

          echo "gate behaves."
